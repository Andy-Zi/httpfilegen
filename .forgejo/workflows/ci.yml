name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: untrusted-nix-xl

    steps:
      - name: Checkout revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          basic_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic $basic_auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
          unset basic_auth GITHUB_TOKEN

      - name: Run tests and coverage
        run: |
          nix develop --command bash -euo pipefail -c '
            uv sync --extra test
            uv run pytest
            uv run coverage report --fail-under=75
          '

  build:
    runs-on: untrusted-nix-xl

    steps:
      - name: Checkout revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          basic_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic $basic_auth" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git remote remove origin
          unset basic_auth GITHUB_TOKEN

      - name: Build package
        run: nix build .#default

      - name: Verify package
        run: |
          test -x result/bin/httpfilegen
          result/bin/httpfilegen --help
